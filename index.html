<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AML Buddy 互動原型 Demo</title>
<link rel="stylesheet" href="./css/style.css?v=20260806-ui-polish-v5">
</head>
<body>

<div class="app-splash" id="appSplash" aria-hidden="true">
  <div class="splash-brand">
    <span class="splash-text splash-bank">OO Bank</span>
    <span class="splash-divider"></span>
    <span class="splash-text splash-product">AML Buddy</span>
  </div>
  <img class="splash-footer-logo" src="./assets/tree-logo.svg" alt="">
</div>

<div class="biz-select-screen" id="bizSelectScreen" aria-hidden="true"></div>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand-area">
      <div class="logo-slot">
        <img src="./assets/tree-logo.svg" alt="OO銀行 xxxx Bank">
        <span class="bank-text">
          <span class="bank-name">
            <span class="desktop-bank-name">OO銀行</span>
            <span class="mobile-bank-name">AML Buddy</span>
          </span>
          <span class="bank-name-en">xxxx Bank</span>
        </span>
      </div>
      <div class="mobile-header-search" id="mobileHeaderSearch" role="search">
        <div class="mobile-header-search-box">
          <input id="mobileHeaderKeywordSearch" class="mobile-header-keyword-search" type="search" placeholder="實質受益人" autocomplete="off">
          <button class="mobile-header-search-close" id="mobileHeaderSearchClose" type="button" aria-label="關閉搜尋">
            <span></span>
            <span></span>
          </button>
        </div>
        <div class="mobile-header-search-results" id="mobileHeaderSearchResults"></div>
      </div>
      <div class="buddy-title">AML Buddy</div>
    </div>

    <button class="mobile-header-search-toggle" id="mobileHeaderSearchButton" type="button" aria-label="搜尋" aria-expanded="false">
      <span class="header-search-icon" aria-hidden="true"></span>
    </button>

    <div class="top-actions">
      <div class="search-wrap" id="searchWrap">
        <div class="search-box">
          <input id="keywordSearch" class="keyword-search" type="search" placeholder="實質受益人" autocomplete="off">
          <button class="search-icon-btn" type="button" aria-label="搜尋"></button>
        </div>
        <div class="search-dropdown" id="searchDropdown"></div>
      </div>

      <div class="lang-switcher sites-switcher" id="mobileSitesSwitcher">
        <button class="mobile-sites-btn" id="mobileSitesButton" type="button" aria-label="常用網站" aria-haspopup="listbox" aria-expanded="false" data-dropdown-trigger>
          <span class="mobile-sites-label" id="mobileSitesLabel">常用網站</span>
        </button>
        <div class="lang-dropdown" id="mobileSitesDropdown"></div>
      </div>

      <div class="language-switch lang-switcher" aria-label="語言切換">
        <button class="language-option is-active" type="button" data-lang-option="zh">中</button>
        <span aria-hidden="true">／</span>
        <button class="language-option" type="button" data-lang-option="en">EN</button>
        <span aria-hidden="true">／</span>
        <button class="language-option" type="button" data-lang-option="ja">日</button>
        <button class="mobile-language-trigger" id="mobileLanguageButton" type="button" aria-haspopup="listbox" aria-expanded="false" data-dropdown-trigger>
          <span id="mobileLanguageLabel">ZH</span>
        </button>
        <div class="lang-dropdown" id="mobileLangDropdown"></div>
      </div>
    </div>
  </div>
</header>

<main class="page-shell">
  <div class="desktop-app" id="app"></div>
  <footer class="page-footer-note" aria-label="頁面聲明">
    <p id="footerNotice">本頁面內容依據總行內規彙整，主要供海外分行／子行同仁參考，如遇當地規範另有規定，請以當地規範為準</p>
    <p id="footerCredits">共同開發：Stanley Liu、Cindy Liou、Leah Fu</p>
  </footer>
</main>

<div class="mobile-menu-layer" id="mobileMenuLayer"></div>
<div id="modalLayer"></div>

<script src="./js/translations.js?v=20260806-ui-polish-v5"></script>
<script src="./js/app.js?v=20260806-ui-polish-v5"></script>
</body>
</html>
